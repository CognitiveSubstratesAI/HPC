name = "HPC"
uuid = "b1c2d3e4-f567-8901-abcd-ef0123456789"
version = "0.1.0"
authors = ["PRIMUS Team"]

[deps]
MORK    = "162375cb-4023-4ef9-895b-22c0041d5c13"
MPI     = "da04e1cc-30fd-572f-bb4f-1f8673147195"

[sources]
# HPC-PKG-1 (audit 2026-06-05): MORK is an unregistered package — without a
# [sources] entry a clean checkout / CI cannot resolve it and instantiation
# fails (the original Project.toml had NO [sources] at all). Dev-link to the
# sibling hardened checkout (mirrors MORKTensorNetworks). MORK's transitive
# PathMap resolves via MORK's own [sources] (Julia 1.11+ propagates them; and
# [sources] only accepts direct deps, so PathMap cannot be listed here anyway).
MORK = {path = "../MORK"}

[compat]
MORK  = "0.1"
MPI   = "0.20"
julia = "1.12"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]
